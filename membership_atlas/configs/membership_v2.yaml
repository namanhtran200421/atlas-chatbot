config_version: "rag-v2"

aws:
  region: "ap-southeast-2"

corpus:
  version: "membership-v1"
  s3_uri: "s3://atlas-membership-knowledge-base-fetching/cleaned/"
preprocessing:
  chunking:
    version: "source-aware-v1"
    tokenizer: "cl100k_base"

    policies:
      article:
        max_tokens: 512
        overlap_units: 1

      research:
        max_tokens: 768
        overlap_units: 1

      faq:
        max_tokens: 512
        overlap_units: 0

      event:
        max_tokens: 512
        overlap_units: 0

      atomic:
        max_tokens: 512
        overlap_units: 0

chunking:
  version: "bedrock-none-v1"
  strategy: "NONE"

metadata_schema_version: "metadata-v1"

embedding:
  model_id: "amazon.titan-embed-text-v2:0"
  dimensions: 1024
  data_type: "FLOAT32"

retrieval:
  search_type: "SEMANTIC"
  candidate_k: 20

reranker:
  enabled: false
  model_arn: null
  final_k: null

generation:
  enabled: false
  model_arn: null
  context_token_budget: null
  prompt_version: null

evaluation_dataset_version: null
