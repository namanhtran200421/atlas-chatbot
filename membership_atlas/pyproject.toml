[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-membership-rag"
version = "0.1.0"
description = "RAG pipeline for the Atlas Membership knowledge assistant"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40,<2",
    "botocore[crt]>=1.40,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "PyYAML>=6,<7",
    "tiktoken>=0.11,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "mypy>=1.11,<2",
    "ruff>=0.8,<1",
    "types-PyYAML>=6,<7",
]

[project.scripts]
membership-rag = "membership_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
membership_rag = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["membership_rag"]
exclude = ["tests", "scripts"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
